name: trading-news-agent
summary: An AI agent that tracks financial news, updates facts, and generates investment recommendations for companies based on a specified market, sector, or theme.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key required for authenticating with the Google Gemini AI service.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: Specifies the initial market, sector, or theme that the agent should track (e.g., "US Semiconductor Market").