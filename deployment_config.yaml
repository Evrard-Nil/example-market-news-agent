name: Trading News Agent
summary: An AI agent that tracks financial news for specific companies based on a user-defined market query, updates relevant facts, and generates investment recommendations hourly using the Google Gemini API.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key for authenticating with the Google Gemini AI service.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: The initial market, sector, or theme for the agent to focus on (e.g., "US Semiconductor Market").