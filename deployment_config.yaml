name: trading-news-agent
summary: An AI agent that tracks financial news for specified companies, updates facts, and generates investment recommendations based on market trends or themes.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key for authenticating with the Google Gemini AI service.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: The initial market, sector, or theme (e.g., 'US Semiconductor Market') that the agent should track for identifying companies and news.