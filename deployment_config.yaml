name: Trading News Agent
summary: An agent that tracks financial news, analyzes sentiment, and generates investment recommendations for companies within a specified market or sector.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key for authenticating with the Google Gemini API.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: The initial market, sector, or theme (e.g., "US Semiconductor Market") for which the agent identifies companies and tracks news.