name: trading-news-agent
summary: An autonomous agent that tracks financial news for specified markets/sectors/themes, updates company facts, and generates hourly investment recommendations.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key required to authenticate with the Google Gemini AI service.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: The initial market, sector, or theme (e.g., "US Semiconductor Market") that the agent should track to identify relevant companies.