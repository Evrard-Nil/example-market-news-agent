name: trading-news-agent
summary: Identifies key publicly traded companies or currencies or cryptocurrencies or bonds within a given market/sector/theme, fetches recent news for them, updates and prunes facts, and generates investment recommendations based on the gathered information.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key required to authenticate with the Google Gemini API for generating AI content.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: Defines the initial market, sector, or theme (e.g., "US Semiconductor Market") that the agent should focus on to identify relevant companies for tracking and analysis.