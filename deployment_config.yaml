stdin: true
name: Trading News Agent
summary: An AI agent that tracks companies based on a user-defined market/theme, fetches financial news, updates relevant facts, and generates hourly investment recommendations using the Google Gemini API.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key required for authenticating with the Google Gemini API.