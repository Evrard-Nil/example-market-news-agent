name: trading-news-agent
summary: An agent that tracks companies based on a target market/sector query, fetches relevant news, updates financial facts, and generates hourly investment recommendations.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key required to authenticate with the Google Gemini API for LLM inference requests.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: The initial market, sector, or theme (e.g., "US Semiconductor Market") that the agent will use to identify and track relevant companies.