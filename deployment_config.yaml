name: trading-news-agent
summary: An AI agent that tracks financial news for specific companies, updates relevant facts, and generates investment recommendations based on market trends or sectors defined by a target query.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key for authenticating with the Google Gemini API.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: The market, sector, or theme for which the agent should identify and track companies (e.g., "US Semiconductor Market").