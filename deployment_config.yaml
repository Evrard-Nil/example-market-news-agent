name: trading-news-agent
summary: An agent that tracks a specified market/sector, fetches relevant news, analyzes sentiment, and generates investment recommendations for key companies within that domain on an hourly basis.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key for authenticating with the Google Gemini API.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: The market, sector, or theme (e.g., 'US Semiconductor Market') that the agent will focus on to identify and track relevant companies.