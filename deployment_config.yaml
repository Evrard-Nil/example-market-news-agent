name: trading-news-agent
summary: This project implements an AI-powered trading news agent that continuously monitors financial news, performs sentiment analysis, and generates investment recommendations for a specified market, sector, or theme. The agent identifies relevant companies, fetches their news, extracts key facts, and provides hourly investment recommendations.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: Your Google Gemini API key, required to authenticate and interact with the Google Gemini API for LLM calls.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: The market, sector, or theme you want the agent to track (e.g., "US Semiconductor Market").