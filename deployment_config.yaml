name: trading-news-agent
summary: An AI agent that tracks companies based on a target market query, fetches recent news, updates financial facts, and generates hourly investment recommendations.
stdin: false
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key to authenticate with the Google Gemini API for AI model inference.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: The initial market, sector, or theme (e.g., "US Semiconductor Market") that the agent should track to identify relevant companies.