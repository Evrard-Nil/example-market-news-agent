stdin: true
name: Trading News Agent
summary: This agent identifies publicly traded companies based on a user-specified market, sector, or theme. It then continuously fetches news for these companies, updates relevant facts, and generates hourly investment recommendations based on the gathered information and sentiment analysis.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key required to authenticate with the Google Gemini API for AI model interactions.