name: trading-news-agent
summary: An agent that tracks financial news for specified companies, analyzes sentiment, and generates investment recommendations.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key for authenticating with the Google Gemini AI service.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: The user's initial query for identifying companies to track (e.g., "US Semiconductor Market").