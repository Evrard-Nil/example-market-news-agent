name: Trading News Agent
summary: An agent that tracks financial news for specified companies, updates relevant facts, and generates hourly investment recommendations based on real-time data using the Gemini API and Google Search.
environment_variables:
  - name: GEMINI_API_KEY
    value: <your_gemini_api_key>
    description: The API key for authenticating with the Google Gemini API.
  - name: TARGET_QUERY
    value: <your_target_query>
    description: The market, sector, or theme (e.g., "US Semiconductor Market") for which the agent should identify and track companies.